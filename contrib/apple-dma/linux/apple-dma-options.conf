# /etc/modprobe.d/apple-dma-options.conf
#
# Module options for apple_dma.
#
# window_shift: Log2 of DMA window coalescing size.  Small DMA maps
#               that fall within the same window share a single DART
#               entry, reducing total map count.
#               18 = 256K (default), 20 = 1M, 22 = 4M, 0 = disabled.
# enable_quirks: Enable vendor-specific workaround quirks.
#                1 = enabled (default), 0 = disable all quirks.
options apple_dma window_shift=18 enable_quirks=1

# apple-vfio passthrough implements MSI/MSI-X but not legacy PCI INTx,
# so any guest driver that probes a passed-through device must use MSI.
#
# snd-hda-intel defaults to enable_msi=-1 ("driver chooses") and on the
# HDA sibling of a passed-through GPU that picks INTx at probe time,
# which either traps the guest in a 1-second irq-poll loop or trips a
# pci_irq_handler assertion on the host. Force MSI here so the INTx
# code path is never reached.
options snd-hda-intel enable_msi=1
